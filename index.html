<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09091a" />
  <title>Q-LAB | Quantum Computing Studio</title>
  <style>
    .qlab-nav-toggle{position:fixed;right:18px;bottom:20px;z-index:10001;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:white;border:1px solid #a78bfa;border-radius:999px;padding:13px 18px;font:600 14px system-ui,sans-serif;box-shadow:0 8px 30px #0009;cursor:pointer}
    .qlab-nav-panel{position:fixed;right:16px;bottom:78px;z-index:10000;width:min(330px,calc(100vw - 32px));padding:17px;background:#131327;color:#f8f7ff;border:1px solid #51417e;border-radius:18px;box-shadow:0 15px 40px #000b;font:14px system-ui,sans-serif}
    .qlab-nav-panel[hidden]{display:none}
    .qlab-nav-panel strong{display:block;margin:0 0 12px;font-size:16px}
    .qlab-nav-panel a{display:block;margin:8px 0;padding:12px;border-radius:11px;background:#23213e;color:#eeeaff;text-decoration:none}
    .qlab-nav-panel a:focus-visible,.qlab-nav-toggle:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
  </style>
</head>
<body>
  <div id="app"></div>
  <nav class="qlab-nav-panel" id="qlab-navigation" aria-label="Navigation Q-LAB" hidden>
    <strong>Explorer Q-LAB</strong>
    <a href="/">🏠 Accueil — Simulateur quantique</a>
    <a href="/circuit-builder.html">⚛️ Éditeur de circuits</a>
    <a href="/teleportation.html">🔗 Téléportation quantique</a>
    <a href="/grover.html">🔎 Algorithme de Grover</a>
  </nav>
  <button type="button" class="qlab-nav-toggle" id="qlab-nav-toggle" aria-expanded="false" aria-controls="qlab-navigation">☰ Modules</button>
  <script>
    (() => {
      const button = document.getElementById('qlab-nav-toggle');
      const panel = document.getElementById('qlab-navigation');
      button.addEventListener('click', () => {
        panel.hidden = !panel.hidden;
        button.setAttribute('aria-expanded', String(!panel.hidden));
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          panel.hidden = true;
          button.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
  <script type="module" src="/src.ts"></script>
</body>
</html>
